<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presidentes Muertos y Vivos – Neón</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 45%, #1a1a24 0%, #0a0a10 60%, #050508 100%);
  }
  svg { width: min(96vw, 900px); height: auto; max-height: 96vh; overflow: visible; }
  svg * { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .tube { stroke-width: 6; }
  .core { stroke-width: 2; }
  .red  { stroke: #ff1f35; }  .core-red  { stroke: #ffd2d6; }
  .wht  { stroke: #dfe9ff; }  .core-wht  { stroke: #ffffff; }
  .blu  { stroke: #1f6bff; }  .core-blu  { stroke: #c4e1ff; }
  .eye-dot { stroke-width: 4; }
  text { font-family: "Oswald", "Bebas Neue", Impact, sans-serif; font-weight: 500; stroke: #ffe81a; stroke-width: 3.5; }
  .sign-text { stroke: #ffe81a; }
  .fig, .sign-text { transition: none; }
</style>
</head>
<body>
<svg viewBox="0 0 900 720" role="img" aria-label="Letrero de neón: Presidentes muertos y vivos">
  <defs>
    <!-- Brillo de neón: varios desenfoques sumados -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/><feMergeNode in="b3"/>
        <feMergeNode in="b2"/><feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rostro común -->
    <g id="face">
      <ellipse cx="0" cy="0" rx="55" ry="80"/>
      <path d="M-55,-5 C-82,-14 -86,38 -52,32"/>
      <path d="M55,-5 C82,-14 86,38 52,32"/>
      <ellipse cx="-24" cy="-8" rx="12" ry="6.5"/>
      <ellipse cx="24" cy="-8" rx="12" ry="6.5"/>
      <circle class="eye-dot" cx="-24" cy="-8" r="1.5"/>
      <circle class="eye-dot" cx="24" cy="-8" r="1.5"/>
      <path d="M-38,-24 L-12,-22 M12,-22 L38,-24"/>
      <path d="M0,-6 L-7,34 L9,37"/>
      <path d="M-18,58 Q0,66 18,58"/>
      <path d="M-28,76 C-30,125 -45,145 -135,162"/>
      <path d="M28,76 C30,125 45,145 135,162"/>
    </g>
    <path id="hairRed" d="M-55,-5 C-62,-85 -8,-100 32,-88 C62,-72 57,-22 55,-5 M-22,-88 C8,-65 20,-35 22,-8"/>
    <path id="capBlue" d="M-55,-22 C-58,-100 58,-100 55,-22 M-55,-24 L55,-24 M-55,-45 C-20,-52 20,-52 55,-45"/>
  </defs>

  <!-- Figura roja -->
  <g id="figRed" class="fig" filter="url(#glow)">
    <g transform="translate(170 175)">
      <g class="tube red"><use href="#face"/><use href="#hairRed"/></g>
      <g class="core core-red"><use href="#face"/><use href="#hairRed"/></g>
    </g>
  </g>

  <!-- Figura blanca -->
  <g id="figWht" class="fig" filter="url(#glow)">
    <g transform="translate(450 175)">
      <g class="tube wht"><use href="#face"/></g>
      <g class="core core-wht"><use href="#face"/></g>
    </g>
  </g>

  <!-- Figura azul (siempre encendida) -->
  <g id="figBlu" class="fig" filter="url(#glow)">
    <g transform="translate(730 175)">
      <g class="tube blu"><use href="#face"/><use href="#capBlue"/></g>
      <g class="core core-blu"><use href="#face"/><use href="#capBlue"/></g>
    </g>
  </g>

  <!-- Texto -->
  <g class="sign-text" filter="url(#glow)">
    <text x="62" y="490" font-size="150" textLength="670" lengthAdjust="spacingAndGlyphs">P<tspan class="r">R</tspan>ESIDENTES</text>
    <text x="62" y="675" font-size="188" textLength="670" lengthAdjust="spacingAndGlyphs">MUE<tspan class="r">R</tspan>TOS</text>
    <text transform="translate(800 470) rotate(90)" font-size="64" textLength="215" lengthAdjust="spacingAndGlyphs">Y VIVOS.</text>
  </g>
</svg>

<script>
(() => {
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const setOpacity = el => l => { el.style.opacity = l; };
  const setStroke  = el => l => { el.style.strokeOpacity = l; };

  const red   = document.getElementById('figRed');
  const white = document.getElementById('figWht');
  const blue  = document.getElementById('figBlu');
  const Rs    = [...document.querySelectorAll('.r')];

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Ráfaga de parpadeos: apaga/enciende rápido y termina encendido
  function burst(set, n, done) {
    let i = 0;
    (function step() {
      if (i >= n) { set(1); done && done(); return; }
      set(i % 2 === 0 ? rand(0.04, 0.3) : rand(0.65, 1));
      i++;
      setTimeout(step, rand(30, 150));
    })();
  }

  // Ciclo de neón: espera aleatoria -> ráfaga -> repite
  function neon(set, { minWait, maxWait, minBurst = 2, maxBurst = 7, dead = 0 }) {
    set(0.05);
    const loop = () => setTimeout(() => {
      if (Math.random() < dead) {
        // tubo "fallando": se apaga un momento y vuelve con ráfaga larga
        set(0.05);
        setTimeout(() => burst(set, randInt(6, 10), loop), rand(500, 1400));
      } else {
        burst(set, randInt(minBurst, maxBurst) * 2, loop);
      }
    }, rand(minWait, maxWait));
    // encendido inicial
    setTimeout(() => burst(set, randInt(6, 10), loop), rand(300, 1400));
  }

  // Azul: siempre encendida
  blue.style.opacity = 1;

  // Roja: falla seguido
  neon(setOpacity(red), { minWait: 1500, maxWait: 4000, minBurst: 2, maxBurst: 6 });

  // Blanca: otros tiempos, más espaciados y con apagón ocasional
  neon(setOpacity(white), { minWait: 3500, maxWait: 8000, minBurst: 1, maxBurst: 4, dead: 0.3 });

  // Letras R: cada una al azar e independiente
  Rs.forEach(r => neon(setStroke(r), { minWait: 1200, maxWait: 6000, minBurst: 1, maxBurst: 5, dead: 0.2 }));
})();
</script>
</body>
</html>
