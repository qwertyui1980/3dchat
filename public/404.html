<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>XStreamX - Redirigiendo...</title>
  <script type="text/javascript">
    // Single Page Apps redirect for GitHub Pages
    var pathSegmentsToKeep = 1; // For repo named 3dchat (e.g. /3dchat/...)
    var l = window.location;
    var repoPath = l.pathname.startsWith('/3dchat') ? '/3dchat' : '';
    var subPath = l.pathname.slice(repoPath.length).replace(/^\/+/, '');
    
    // Convert deep path to hash so SPA loads index.html cleanly
    var targetHash = subPath ? '#' + subPath : '';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      repoPath + '/' + targetHash + (l.search || '')
    );
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #888;">
    Cargando XStreamX...
  </p>
</body>
</html>
